# SIMULATOR SETTINGS
simulation:
  dt: 4e-3
  substeps : 10
  backend : gpu
  precision : '32'
  performance_mode : True
  viewer_options:
    show_viewer : False
    viewer_type: "bird"
    camera_fov : 30
    max_FPS: 60


sandbox:
  box:
    pos : [0.0, 0.0, 0.0]
    vol : [0.127, 0.127, 0.04]
    wall_thickness : 0.02
    omit : False
    properties : 
      friction : 0.15
  material:
    vol : [0.12, 0.12, 0.05]
    type : "rsa" 
    properties :
      cubes : True
      n_particles : 10
      particle_size : [0.009, 0.012]
      density : [1200, 1500]
      friction : [0.3, 0.55]
  safety_margin : 0.005

plate:
  size : [0.04, 0.001, 0.01]

