# SIMULATOR SETTINGS
simulation:
  dt: 4e-3
  substeps : 2
  backend : gpu
  precision : '32'
  performance_mode : True
  viewer_options:
    show_viewer : False
    viewer_type: None
    camera_fov : 30
    max_FPS: 60

rigid_options:
  iterations: 10
  ls_iterations: 10
  tolerance: 1e-4
  ls_tolerance: 0.05
  box_box_detection: True
  use_contact_island: True
  use_hibernation: False


sandbox:
  box:
    pos : [0.0, 0.0, 0.0]
    vol : [0.128, 0.128, 0.04]
    wall_thickness : 0.02
    omit : False
    properties : 
      friction : 0.15
  material:
    vol : [0.12, 0.12, 0.05]
    type : "rsa" 
    properties :
      shape : "cube"
      n_particles : 10
      particle_size : [0.009, 0.012]
      density : [1200, 1500]
      friction : [0.3, 0.55]
  safety_margin : 0.005

plate:
  size : [0.04, 0.002, 0.01]
